[workspace]
resolver = "3"
members = [
    "crates/types",
    "crates/telemetry",
    "crates/service",
    "crates/proto",
    "crates/mailbox",
    "crates/router",
    "crates/runtime",
    "crates/alloc-count",
    "crates/link",
    "crates/client",
    "crates/surreal",
    "crates/valkey",
    "crates/jobs",
    "crates/accounts",
    "crates/s3",
    "crates/push-providers",
    "crates/send",
    "crates/pow",
    "crates/keys",
    "crates/akd",
    "crates/content",
    "crates/groups",
    "crates/sync",
    "crates/backup-format",
    "crates/backup-storage",
    "crates/entitlements",
    "crates/tokens",
    "crates/app-core",
    "services/delivery",
    "services/api",
    "services/push",
    "services/worker",
    "services/calls",
    "services/billing",
    "services/proxy",
    "tools/loadgen",
    "tools/admin",
    "tests/e2e",
    "tests/groups",
    "xtask",
]
# Fuzz targets need nightly and libFuzzer; they live outside the workspace (see fuzz/README.md).
exclude = ["fuzz", "tools/libsignal-vectors", "tools/openmls-vectors", "tools/calls-harness"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95" # the Iggy SDK needs 1.95 (D-0030)
publish = false
license = "LicenseRef-Proprietary"
repository = "https://github.com/songbirdchat/songbird"

# Every dependency here has a recorded reason in docs/DECISIONS.md (D-0004).
[workspace.dependencies]
songbird-types = { path = "crates/types" }
songbird-telemetry = { path = "crates/telemetry" }
songbird-service = { path = "crates/service" }
songbird-proto = { path = "crates/proto" }
songbird-mailbox = { path = "crates/mailbox" }
songbird-router = { path = "crates/router" }
songbird-runtime = { path = "crates/runtime" }
songbird-alloc-count = { path = "crates/alloc-count" }
songbird-link = { path = "crates/link" }
songbird-client = { path = "crates/client" }
songbird-surreal = { path = "crates/surreal" }
songbird-valkey = { path = "crates/valkey" }
songbird-jobs = { path = "crates/jobs" }
songbird-accounts = { path = "crates/accounts" }
songbird-s3 = { path = "crates/s3" }
songbird-delivery = { path = "services/delivery" }
songbird-push-providers = { path = "crates/push-providers" }
songbird-send = { path = "crates/send" }
songbird-pow = { path = "crates/pow" }
songbird-akd = { path = "crates/akd" }
songbird-keys = { path = "crates/keys" }
songbird-content = { path = "crates/content" }
songbird-groups = { path = "crates/groups" }
songbird-sync = { path = "crates/sync" }
songbird-backup-format = { path = "crates/backup-format" }
songbird-backup-storage = { path = "crates/backup-storage" }
songbird-entitlements = { path = "crates/entitlements" }
songbird-tokens = { path = "crates/tokens" }
songbird-calls = { path = "services/calls" }

anyhow = "1.0.104"
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
futures-sink = "0.3.34"
prost = { version = "0.14.5", default-features = false, features = ["derive", "std"] }
sockudo-ws = { version = "3.1.1", default-features = false, features = ["tokio-runtime"] }
bytes = "1.12.1"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
getrandom = "0.4.3"
hex = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
mimalloc = { version = "0.1.52", default-features = false }
prometheus-client = "0.26.0"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.16.0", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
# Apache Iggy client SDK (owner decision D-0030); pinned with the server image (0.10.0).
iggy = "=0.12.0"
secrecy = "0.10"
# Thread-per-core runtime (D-0032): SO_REUSEPORT listeners and CPU pinning, both already in the
# dependency graph (no new crates).
socket2 = { version = "0.6.5", features = ["all"] }
rustix = { version = "1.1.6", default-features = false, features = ["std", "thread"] }
# Device directory (D-0032: fastest and best p99 of papaya, scc, dashmap); already in the graph
# through the Iggy SDK.
papaya = "=0.2.5"
# Hot-swapped read-mostly state (the device directory reloaded from SurrealDB, D-0036): readers
# take no lock (constitution: arc-swap for hot-reloaded configuration).
arc-swap = "1.9.5"
# Valkey client for cross-node routing (D-0034); TLS through rustls with the process's aws-lc-rs
# provider; default features (scripting, streams, geo, bignum, ACL helpers) off.
redis = { version = "=1.8.1", default-features = false, features = ["tokio-comp", "tokio-rustls-comp"] }
time = { version = "0.3.55", features = ["std"] }
tokio = { version = "1.54.1", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "json", "registry", "env-filter", "ansi"] }
zeroize = "1.9.1"
# Push providers (D-0036): JSON off the hot path (service-account file, OAuth and provider error
# bodies), already in the tree through the Iggy SDK; Mozilla's root store for APNs, FCM and Web
# Push endpoints, already in the tree (licence exception in deny.toml).
serde_json = "1.0.154"
# Compact, specified binary serde format for the MLS delivery service's stored group state (D-0066):
# OpenMLS stores state as serde values, and JSON triples the size of every public key.
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
async-trait = "0.1"
protobuf = "=3.7.2"
akd = { version = "=0.13.0", default-features = false, features = ["whatsapp_v1", "serde_serialization", "public_auditing"] }
webpki-roots = "1.0.12"
# Registration proof of work (D-0048): Argon2id as the prompt requires; aws-lc-rs has no Argon2.
# RustCrypto, MIT OR Apache-2.0; default features (password-hash strings, getrandom) off.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc"] }
# Point checks on identity keys aws-lc-rs does not expose; XEdDSA and the username hash later
# (D-0047: implement the protocols on permissive crates, D-0048). BSD-3-Clause; default features off.
curve25519-dalek = { version = "=5.0.0", default-features = false }

# XChaCha20-Poly1305 for backups (Prompt 10, D-0119; the prompt names the cipher): aws-lc-rs has
# only the 12-byte-nonce ChaCha20-Poly1305. RustCrypto, MIT OR Apache-2.0, already in the lock
# through OpenMLS's crypto provider and exempted in cargo-vet; no default features.
chacha20poly1305 = { version = "=0.10.1", default-features = false }

# app-core's on-device store (A2, D-0137): SQLCipher through rusqlite's bundled build. No
# vendored OpenSSL: CommonCrypto on Apple, a libcrypto (AWS-LC) linked at build time elsewhere;
# the `openssl` crates stay banned. MIT.
rusqlite = { version = "=0.37.0", default-features = false, features = ["bundled-sqlcipher"] }

# Test-only
proptest = "1.12.0"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
# Set by `cargo xtask sanitize`: binaries keep the system allocator under ASan and TSan.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(songbird_sanitizer)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Selected restriction lints (constitution: pedantic plus selected restriction lints).
allow_attributes_without_reason = "warn"
as_conversions = "warn"
dbg_macro = "warn"
exit = "warn"
expect_used = "warn"
get_unwrap = "warn"
indexing_slicing = "warn"
mem_forget = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"
# Pedantic lints we do not want.
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
debug = false
incremental = false

# Backup tests encrypt hundreds of megabytes; RustCrypto's ChaCha20 and Poly1305 are 30 times
# slower unoptimised (Prompt 10, D-0120), and so is the chunker's per-byte loop. Only these crates
# are optimised in dev builds.
[profile.dev.package.songbird-backup-format]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3

# Release with debug info for perf/flamegraphs (cargo xtask bench --profile profiling).
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
