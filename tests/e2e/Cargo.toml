[package]
name = "songbird-e2e"
description = "End-to-end tests: the real client against the real delivery server, one named test per invariant."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# Server and client crates never depend on each other (master prompt §3); this test crate is the
# one place both meet.
[dependencies]
songbird-client.workspace = true
songbird-delivery.workspace = true
songbird-mailbox.workspace = true
songbird-proto.workspace = true
songbird-router.workspace = true
songbird-service.workspace = true
songbird-surreal.workspace = true
songbird-types.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }

[dev-dependencies]
# Prompt 10: the backup format and stores against the real vault.
songbird-backup-format.workspace = true
songbird-backup-storage.workspace = true
songbird-accounts.workspace = true
songbird-jobs.workspace = true
songbird-s3.workspace = true
songbird-valkey.workspace = true
songbird-api = { path = "../../services/api" }
# Prompt 11: plans in every gate that builds an `App`.
songbird-entitlements.workspace = true
songbird-tokens.workspace = true
async-trait.workspace = true
# Prompt 7's gate: calls through `api` against a real LiveKit.
songbird-calls.workspace = true
livekit-api = { version = "=0.10.2", default-features = false, features = ["access-token"] }
livekit-protocol = "=0.8.3"
prost.workspace = true
zeroize.workspace = true
songbird-send.workspace = true
songbird-keys.workspace = true
songbird-content.workspace = true
songbird-app-core.workspace = true
# Key transparency in the A2 gate (D-0168): the real log, published by the worker's publisher.
songbird-akd.workspace = true
hyper.workspace = true
songbird-worker = { path = "../../services/worker" }
# A stand-in for delivery's device link in the Prompt 6 gate.
songbird-link.workspace = true
songbird-push = { path = "../../services/push" }
songbird-push-providers = { workspace = true, features = ["test-support"] }
aws-lc-rs.workspace = true
hex.workspace = true
redis.workspace = true
serde_json.workspace = true
songbird-groups.workspace = true
songbird-groups-harness = { path = "../groups" }
postcard.workspace = true
futures-util.workspace = true
songbird-alloc-count.workspace = true
songbird-telemetry.workspace = true
futures-core.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
futures-sink.workspace = true
rcgen.workspace = true
# The proxy relay, dialed by the client (Prompt 9: the proxy setting).
songbird-proxy = { path = "../../services/proxy" }
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
sockudo-ws.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
