name: codeql

# Every pull request, every push to main, weekly, and on demand, on GitHub-hosted runners (D-0045).
# The job fails on any finding, as before (D-0015). Results are also uploaded to code scanning
# (the Security tab), which a public repository has for free; not from pull requests, whose token
# from a fork cannot write security events.
on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      # codeql-action reads the workflow run to build the analysis key.
      actions: read
      contents: read
      # Upload to code scanning (D-0045). A fork's pull request gets this as read only.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      # The job gates on the SARIF itself and keeps it as an artifact (D-0015); outside pull
      # requests the results also go to code scanning (D-0045).
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ github.event_name == 'pull_request' && 'never' || 'always' }}
          output: sarif-results
      - name: Keep SARIF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: error
          retention-days: 30
      # Waivers (D-0015: tests/ only; D-0185: reviewed lines, owner-approved) live in
      # scripts/codeql-gate.py and .github/codeql-waivers.json. Every other finding fails the job.
      - name: Fail on findings
        env:
          LANGUAGE: ${{ matrix.language }}
        run: python3 -I scripts/codeql-gate.py "sarif-results/${LANGUAGE}.sarif" .
