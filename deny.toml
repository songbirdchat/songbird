# cargo-deny: advisories, licences, bans and sources. Run by `cargo xtask ci`.
[graph]
all-features = false

[advisories]
# Every advisory fails the build unless listed here with a reason and an expiry review date.
ignore = [
    # D-0068: crypto-bigint 0.5.5's constant-time arithmetic can branch on secrets. It reaches
    # the tree only through the test harness (tests/groups: OpenMLS's RustCrypto provider, its
    # P-256/P-384 code); no service links it (crates/groups manifest guard), and Songbird groups
    # use X-Wing and Ed25519 only. The fix (0.7.6) needs elliptic-curve 0.14 upstream.
    # Review by 2027-02-16, or at the next OpenMLS provider upgrade, whichever comes first.
    { id = "RUSTSEC-2026-0387", reason = "test harness only (D-0068); review by 2027-02-16" },
]
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Permissive licences only. Adding one requires a DECISIONS.md entry.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.93
# Per-crate exceptions, each recorded in docs/DECISIONS.md (D-0030: Iggy SDK dependencies;
# D-0034: the Valkey client).
exceptions = [
    { allow = ["Zlib"], crate = "foldhash" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
    { allow = ["BSL-1.0"], crate = "xxhash-rust" },
    # D-0068: HPKE for OpenMLS's RustCrypto provider, in the test harness (tests/groups) only;
    # no service links them (crates/groups manifest guard).
    { allow = ["MPL-2.0"], crate = "hpke-rs" },
    { allow = ["MPL-2.0"], crate = "hpke-rs-crypto" },
    { allow = ["MPL-2.0"], crate = "hpke-rs-rust-crypto" },
    # D-0117: the camera's pure-Rust JPEG encoder for desktop stills; its acknowledgement is on
    # the app's licences page.
    { allow = ["IJG"], crate = "jpeg-encoder" },
    # D-0151: flate2's pure-Rust zlib backend, which LiveKit's SDK selects (call media,
    # apps/calls-media); acknowledged on the app's licences page.
    { allow = ["Zlib"], crate = "zlib-rs" },
]

[licenses.private]
# Songbird's own crates are unpublished (publish = false); their licence is chosen later.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # Locked stack: rustls with aws-lc-rs. No OpenSSL bindings, no ring-only TLS paths.
    { name = "openssl", reason = "locked stack uses rustls + aws-lc-rs" },
    { name = "openssl-sys", reason = "locked stack uses rustls + aws-lc-rs" },
    { name = "native-tls", reason = "locked stack uses rustls + aws-lc-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
