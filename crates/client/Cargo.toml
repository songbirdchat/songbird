[package]
name = "songbird-client"
description = "Rust delivery client: connection state machine, device authentication, backoff honouring retry hints, seq dedupe, batched cumulative ACKs. Used by app-core and loadgen."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
songbird-proto.workspace = true
songbird-types.workspace = true
aws-lc-rs.workspace = true
bytes.workspace = true
futures-core.workspace = true
futures-sink.workspace = true
getrandom.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
sockudo-ws.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros", "io-util"] }
tokio-rustls.workspace = true
# HTTPS through the proxy (D-0164): HTTP/1.1 inside the tunnelled TLS session.
hyper = { workspace = true, features = ["client"] }
hyper-util.workspace = true
http-body-util.workspace = true
# Mozilla's roots for proxies and public endpoints (Prompt 9: the proxy setting).
webpki-roots.workspace = true

[lints]
workspace = true
