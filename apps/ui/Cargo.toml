[package]
name = "nsh-app-songbird"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.6.0"
nsh-base = "0.6.0"
env_logger = "0.11"
# Theme variants (light, dark, high contrast) are built from theme.json at run time.
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
# The real backend (src/backend): the server's own crates, so wire formats
# can't drift. Not songbird-api (a service crate with database clients).
songbird-types = { path = "../../crates/types" }
songbird-proto = { path = "../../crates/proto" }
songbird-pow = { path = "../../crates/pow" }
songbird-keys = { path = "../../crates/keys" }
songbird-client = { path = "../../crates/client" }
# Settings and contacts as encrypted records (Prompt 9), and the content
# formats the app writes: profile, presence, supervision.
songbird-sync = { path = "../../crates/sync" }
songbird-content = { path = "../../crates/content" }
# Backups (Prompt 10): the format, the stores, the runs and the transfer. They run on NSH's
# tokio runtime (`background`).
songbird-backup-format = { path = "../../crates/backup-format" }
songbird-backup-storage = { path = "../../crates/backup-storage" }
# Plans (Prompt 11): anonymous tokens for the vault and plans (D-0128, D-0130).
songbird-tokens = { path = "../../crates/tokens" }
# app-core (A2, D-0136 to D-0139): sessions, the SQLCipher store and the message pipeline.
songbird-app-core = { path = "../../crates/app-core" }
async-trait = "0.1"
tokio = { version = "1.54.1", default-features = false, features = ["net", "sync"] }
zeroize = "1.9.1"
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }
# Call media (D-0151, D-0152): LiveKit over a pinned libwebrtc, end-to-end encrypted per
# sender. Builds need `eval "$(scripts/fetch-libwebrtc.sh <platform>)"` first.
songbird-calls-media = { path = "../calls-media" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The camera (D-0110): one interface over each platform's camera; all `unsafe` lives there.
songbird-camera = { path = "../camera" }
# Real QR codes (D-0110): the link code, invites, safety numbers. No `image`/`svg`: no deps.
qrcode = { version = "0.14.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.6.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.6.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

# The camera's native preview registers here (`#[native_components(ios)]`, D-0110).
[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = { version = "0.6.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.6.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[dev-dependencies]
# The real engine, headless, for tests of the reactive wiring (NSH testing guide).
nsh-engine = { version = "0.6.0", default-features = false }
nsh-testing = { version = "0.6.0", default-features = false }
