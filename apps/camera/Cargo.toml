[package]
name = "songbird-camera"
version = "0.1.0"
edition = "2024"
publish = false
description = "Songbird's camera: one interface over AVFoundation, CameraX, Media Foundation and PipeWire (D-0110)"

# Its own workspace, as apps/ui: the app's crates are outside the server workspace.
[workspace]

[dependencies]
# On-device QR decoding where the OS has none (Android, Windows, Linux) and as
# the fallback on Apple (D-0110). No `img`: frames come as grey bytes.
rqrr = { version = "0.11.0", default-features = false }

# Desktop stills (Windows, Linux) are encoded from frames in pure Rust (D-0114).
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }

# Windows: Media Foundation, the consent store, Direct2D (D-0114); the version NSH links.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Registry", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Dxgi_Common"] }
nsh-platform-windows = { version = "0.7.0", default-features = false }
serde_json = "1"

# Linux: V4L2 and a GTK picture (D-0114); gtk4 at the version NSH links.
[target.'cfg(target_os = "linux")'.dependencies]
v4l = { version = "0.14.0", default-features = false, features = ["v4l2"] }
gtk4 = "0.11"
nsh-platform-linux = { version = "0.7.0", default-features = false }
serde_json = "1"

[dev-dependencies]
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# Framework names (AVFoundation, CameraX) are words in these docs, not code.
doc_markdown = "allow"

# macOS and iOS: AVFoundation from Rust (D-0110, M2), the same objc2 family and versions as
# NSH's platform crates; serde_json for the preview component's props.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDate", "NSDictionary", "NSError", "NSNotification", "NSOperation", "NSRunLoop", "NSString", "NSValue", "NSObject", "NSGeometry", "block2", "objc2-core-foundation"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-media", "objc2-core-video", "objc2-quartz-core", "AVAnimation", "AVCaptureDevice", "AVCaptureInput", "AVCaptureMetadataOutput", "AVCaptureOutputBase", "AVCapturePhotoOutput", "AVCaptureSession", "AVCaptureSessionPreset", "AVCaptureVideoDataOutput", "AVCaptureVideoPreviewLayer", "AVMediaFormat", "AVMetadataObject", "AVVideoSettings"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMBase", "CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView"] }
nsh-platform-macos = { version = "0.7.0", default-features = false }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes", "CFData"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "UIResponder", "UIView", "objc2-quartz-core"] }
# Call video drawn natively (D-0183): CGImages on a layer.
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage", "CGDataProvider", "CGColorSpace"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CATransaction", "objc2-core-foundation"] }
nsh-platform-ios = { version = "0.7.0", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dev-dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSRunLoop"] }

# Android: CameraX in the Gradle host, reached over JNI (D-0113); the jni version NSH links.
# The preview and call video register with NSH's own activity as Rust components (D-0188).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
nsh-platform-android = { version = "0.7.0", default-features = false }
log = "0.4"
serde_json = "1"
