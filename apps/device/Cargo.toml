[package]
name = "songbird-device"
version = "0.1.0"
edition = "2024"
publish = false
description = "Songbird on the device's own services: secure storage, biometrics, screen protection, photos, location, icons (D-0172)"

# Its own workspace, as apps/ui: the app's crates are outside the server workspace.
[workspace]

[dependencies]
zeroize = "1.9.1"
getrandom = "0.3"

# macOS and iOS: the Keychain (Security.framework, no OpenSSL) and objc2 for the rest, the
# same objc2 family and versions as NSH's platform crates.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = { version = "3.7.0", default-features = false }
objc2 = "0.6.5"
block2 = "0.6.2"
# The main queue: NSH runs the app on its engine thread, AppKit and UIKit take calls on main.
dispatch2 = "0.3.1"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSError", "NSString", "NSObject", "NSArray", "NSData", "NSDate", "NSValue", "NSNotification", "NSThread", "NSURL", "NSUUID", "NSSet", "NSBundle", "NSDictionary", "NSFileManager"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "block2", "LAContext", "LAError", "LABiometryType"] }
objc2-core-location = { version = "0.3.2", default-features = false, features = ["std", "CLLocation", "CLLocationManager", "CLLocationManagerDelegate", "CLError"] }
objc2-authentication-services = { version = "0.3.2", default-features = false, features = ["std", "block2", "ASAuthorizationPlatformPublicKeyCredentialProvider", "ASAuthorizationPlatformPublicKeyCredentialRegistrationRequest", "ASAuthorizationPlatformPublicKeyCredentialAssertionRequest", "ASAuthorizationPlatformPublicKeyCredentialDescriptor", "ASAuthorizationPublicKeyCredentialAssertionRequest", "ASAuthorizationPublicKeyCredentialRegistrationRequest", "ASAuthorizationPublicKeyCredentialDescriptor", "ASAuthorizationController", "ASAuthorizationRequest", "ASAuthorization", "ASAuthorizationError"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow", "NSImage"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "UIScreen", "UIApplication", "UIResponder"] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionTypes"] }
objc2-push-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "PKPushRegistry", "PKPushCredentials", "PKPushPayload", "PKDefines"] }
objc2-call-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-avf-audio", "CXProvider", "CXProviderConfiguration", "CXCallUpdate", "CXHandle", "CXAction", "CXCallAction", "CXAnswerCallAction", "CXEndCallAction", "CXSetMutedCallAction", "CXError"] }
objc2-photos = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "PHPhotoLibrary", "PHAssetCreationRequest", "PHAssetChangeRequest", "PHChangeRequest", "PhotosTypes"] }

# Android: the Keystore and BiometricPrompt in Songbird's Gradle host, over JNI.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# Passkeys (D-0177): the WebAuthn JSON Android's CredentialManager speaks.
serde_json = "1"

# Windows: DPAPI and Windows Hello; the version NSH links.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Security_Credentials_UI", "Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Devices_Geolocation", "Win32_Networking", "Win32_Networking_WindowsWebServices"] }
# Passkeys (D-0181): clientDataJSON, written by the app on Windows.
serde_json = "1"

# Linux: the Secret Service (GNOME Keyring, KWallet) over D-Bus, pure Rust crypto.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5", default-features = false, features = ["rt-tokio-crypto-rust"] }
# GeoClue (location) on the same D-Bus library.
zbus = { version = "5.19.0", default-features = false, features = ["tokio", "blocking-api"] }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
